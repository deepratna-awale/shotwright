profiles:
  - id: hunyuanvideo-1.5-480p
    family: hunyuanvideo
    variant: "1.5 480p"
    params: 8.3B
    temporal_factor: 4
    spatial_multiple: 16
    native_fps: 24
    frames: {min: 5, default: 121, max: 121, recommended: 121}
    resolution_buckets: [848x480, 480x848]
    pixel_budget: 409600
    conditioning: [t2v, i2v]
    continuity: [last_frame_i2v]
    min_vram_gb: 14
    vram_presets:
      - {min_gb: 24, recipe: full+vae_tiling}
      - {min_gb: 14, recipe: offload+vae_tiling}
    backends:
      diffusers: HunyuanVideo15Pipeline
      diffusers_repo: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_t2v
      diffusers_i2v: HunyuanVideo15ImageToVideoPipeline
      diffusers_repo_i2v: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_i2v
      comfyui: native
    prompt:
      encoder: Qwen2.5-VL
      tokenizer: Qwen/Qwen2.5-VL-7B-Instruct
      max_tokens: 1000
      tokens_per_word: 1.3
      t2v_words: [120, 350]
      i2v_words: [10, 80]
      i2v: motion
    call_params:
      t2v: {num_inference_steps: 50}
      i2v: {num_inference_steps: 50}
    license: tencent-hunyuan-community
    sources: [https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5]
    notes: Optional step-distilled super-resolution to 720p and 1080p.

  - id: hunyuanvideo-1.5-720p
    base: hunyuanvideo-1.5-480p
    variant: "1.5 720p"
    resolution_buckets: [1280x720, 720x1280]
    pixel_budget: 921600
    backends:
      diffusers_repo: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
      diffusers_repo_i2v: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_i2v
